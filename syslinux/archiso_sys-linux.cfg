LABEL arch
TEXT HELP
Boot the jkOS live environment (KDE Plasma) on BIOS.
Use the Install jkOS icon to run the online Calamares installer.
ENDTEXT
MENU LABEL jkOS live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash %KERNEL_PARAMS%
